name: Django CI Pipeline

on:
  push:
    branches: [ "dev" ]                  
  pull_request:
    branches: [ "dev" ]                 

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
  
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.14            
      uses: actions/setup-python@v3
      with:
        python-version: "3.14"
    
    - name: Install system dependencies   
      run: |
        sudo apt-get update
        sudo apt-get install -y libjpeg-dev zlib1g-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install django pillow        
    
    - name: Install development tools     
      run: |
        pip install pylint pylint-django
        pip install flake8 black
    
    - name: Check Python syntax with Pylint
      run: |
        pylint --recursive=y --fail-under=5.0 \
          --load-plugins=pylint_django \
          --django-settings-module=cooking.settings \
          recipes/ || echo "Pylint completed"
    
    - name: Check code style with Flake8
      run: |
        flake8 . --count --max-complexity=10 --statistics || echo "Flake8 completed"
    
    - name: Run Django migrations check
      run: |
        python manage.py makemigrations --check --dry-run
    
    - name: Run Django tests
      env:
        DEBUG: "True"
        SECRET_KEY: "test-secret-key-for-ci"  
      run: |
        python manage.py test --noinput
    
    - name: Security check with Bandit     
      run: |
        pip install bandit
        bandit -r recipes/ -ll || echo "Bandit completed"
    
   
    - name: Check static files
      run: |
        python manage.py collectstatic --noinput --dry-run
