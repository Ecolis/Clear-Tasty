<!-- templates/recipes/password_reset.html -->
{% extends 'base.html' %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-warning">
                <h4 class="mb-0">🔑 Восстановление пароля</h4>
            </div>
            <div class="card-body">
                <p>Введите email, указанный при регистрации. Мы отправим вам инструкции по восстановлению пароля.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email:</label>
                        <input type="email" name="email" class="form-control" id="id_email" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning">Отправить инструкции</button>
                        <a href="{% url 'login' %}" class="btn btn-outline-secondary">Назад ко входу</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
